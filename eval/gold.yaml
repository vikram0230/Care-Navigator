# Hand-curated ground truth for Care Navigator RAG evaluation (Phase 1: retrieval).
#
# Relevance is SOURCE-LEVEL: a retrieved chunk is "relevant" when its `source` metadata
# (PDF filename) is in `expected_sources`. Filenames are stable across re-seeding; chunk
# IDs are random UUIDs and cannot be used as labels.
#
# Fields:
#   id                : stable identifier
#   question          : the employee question sent to POST /rag/query
#   company_id        : tenant (bcbs | wells_fargo); global tier-1 is shared across both
#   category          : normal | filter | out_of_scope | injection
#   expected_sources  : PDF filenames that SHOULD answer this (empty for out_of_scope/injection)
#   expected_tier     : 1 (global) or 2 (tenant) — informational
#   filter_doc_types  : optional; passed through as filter_doc_types to the query
#   filter_plan_years : optional; passed through as filter_plan_years to the query
#   expected_doc_type : optional; asserted on every citation for `filter` items
#   answer_key_phrases: optional; substrings a correct answer/chunk would contain
#   reference_answer  : optional short gold answer (for the deferred LLM-as-judge pass)

